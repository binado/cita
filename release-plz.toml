[workspace]
# release-plz reads Conventional Commits for version bumps and writes per-crate
# CHANGELOGs. All eight crates share `version_group = "bibi"` so they stay in
# lockstep on a single version, matching the "all crates share one version"
# contract. Default per-crate git tags ({{ package }}-v{{ version }}) and
# changelog updates are kept.

[[package]]
name = "bibi-bibtex"
version_group = "bibi"

[[package]]
name = "bibi-core"
version_group = "bibi"

[[package]]
name = "bibi-provider"
version_group = "bibi"

[[package]]
name = "bibi-inspire"
version_group = "bibi"

[[package]]
name = "bibi-manifest"
version_group = "bibi"

[[package]]
name = "bibi-documents"
version_group = "bibi"

[[package]]
name = "bibi-application"
version_group = "bibi"

[[package]]
name = "bibi"
version_group = "bibi"
