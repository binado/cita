[package]
name = "bibi"
description = "A bibliography CLI that keeps provider-owned references in a manifest and renders BibTeX on demand."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anstyle = { workspace = true }
anyhow = { workspace = true }
bibi-application = { workspace = true }
bibi-documents = { workspace = true }
bibi-inspire = { workspace = true }
bibi-provider = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
opener = { workspace = true }
terminal_size = { workspace = true }
tokio = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
# Test-only: the table's unit tests build `Record` values, and `Record::new`
# needs domain types `bibi_application::domain` deliberately does not re-export.
# The shipped dependency graph is unchanged.
bibi-core = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
