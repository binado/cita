[workspace]
members = [
    "crates/cita",
    "crates/cita-core",
    "crates/cita-documents",
    "crates/cita-inspire-client",
    "crates/cita-bibliography",
    "crates/cita-store",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/binado/cita"
authors = ["Bernardo Veronese"]

[workspace.dependencies]
anstyle = "1"
anyhow = "1.0.94"
biblatex = "0.12"
clap = { version = "4.5.23", features = ["derive"] }
clap_complete = "4"
cita-bibliography = { path = "crates/cita-bibliography", version = "0.5.0" }
cita-core = { path = "crates/cita-core", version = "0.5.0" }
cita-documents = { path = "crates/cita-documents", version = "0.5.0" }
cita-inspire-client = { path = "crates/cita-inspire-client", version = "0.5.0" }
cita-store = { path = "crates/cita-store", version = "0.5.0" }
flate2 = "1"
httpdate = "1"
opener = "0.8.5"
percent-encoding = "2.3.2"
reqwest = { version = "0.12.9", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
tar = "0.4"
tempfile = "3.14.0"
terminal_size = "0.4"
thiserror = "2.0.7"
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8.19"
url = "2.5.4"
