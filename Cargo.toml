[workspace]
members = [
    "crates/cita",
    "crates/cita-core",
    "crates/cita-documents",
    "crates/cita-inspire-client",
    "crates/cita-bibliography",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/binado/cita"
authors = ["Bernardo Veronese"]

[workspace.dependencies]
anstyle = "1"
anyhow = "1.0.94"
biblatex = "0.12"
clap = { version = "4.5.23", features = ["derive"] }
httpdate = "1"
opener = "0.8.5"
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls"] }
tempfile = "3.14.0"
terminal_size = "0.4"
thiserror = "2.0.7"
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5.4"
