name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    strategy:
      matrix:
        rust: ["1.88", stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace

  # Exercises the real INSPIRE API (crates/cita/tests/e2e.rs) instead of the
  # hermetic local-TcpListener suites above. Runs on the same triggers as
  # `test`, plus manual dispatch and a weekly schedule as a standalone
  # liveness check on main.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --test e2e -- --ignored
